<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap');

    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background: #000000;
      color: #ffffff;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: cover;
    }

    .title {
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      margin: 0;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 9999px;
      background: transparent;
      color: #888888;
      border: 1px solid #888888;
    }

    .status-badge.connected {
      background: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    .text-sm {
      font-size: 13px;
      color: #d1d5db;
      margin: 4px 0;
    }

    .meta-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .meta-tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 11px;
      color: #9ca3af;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      text-decoration: none;
      box-sizing: border-box;
    }

    .btn-primary {
      background: #ffffff;
      color: #000000;
    }

    .btn-primary:hover {
      background: #e5e5e5;
    }

    .jobs-list {
      max-height: 120px;
      overflow-y: auto;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .job-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 12px;
      border-left: 3px solid #6366f1;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .job-item:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(3px);
    }

    .job-title {
      font-weight: 500;
      color: #e5e7eb;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 180px;
    }

    .job-company {
      font-size: 10px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-group">
      <img class="logo" src="icon48.png" alt="100x job" />
      <h1 class="title">100x job</h1>
    </div>
    <span class="status-badge" id="conn-status">Disconnected</span>
  </div>

  <div class="card" id="settings-card" style="display:none;">
    <div class="section-title">Active Search Settings</div>
    <div class="text-sm" id="profile-name">Loading Profile...</div>
    <div class="meta-list" id="keywords-list"></div>
  </div>

  <div class="card" id="jobs-card" style="display:none;">
    <div class="section-title">Recent Pipeline Jobs</div>
    <div class="jobs-list" id="jobs-list"></div>
  </div>

  <a href="http://localhost:3004" target="_blank" class="btn btn-primary">
    🖥️ Open React Dashboard
  </a>

  <script src="popup.js"></script>
</body>
</html>
